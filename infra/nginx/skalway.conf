# Skalway — Nginx de referência (HOST Ubuntu)
#
# ARQUIVO DE PLANEAMENTO — NÃO instalar automaticamente na VPS.
# Copiar manualmente para /etc/nginx/sites-available/ quando for deploy.
#
# Fluxo futuro:
#   Cloudflare Full Strict → Nginx :443 →
#     phrx.skalway.com     → /var/www/phrx
#     api-phrx.skalway.com → 127.0.0.1:4001 → container phrx_backend:3300
#
# Certificados Origin CA (Cloudflare):
#   /etc/ssl/cloudflare/origin.crt
#   /etc/ssl/cloudflare/origin.key

# API PhRx (Docker mapeia 127.0.0.1:4001 → container:3300)
upstream phrx_api_loopback {
    server 127.0.0.1:4001;
    keepalive 32;
}

# --- HTTP: redirecionar para HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name phrx.skalway.com api-phrx.skalway.com;
    return 301 https://$host$request_uri;
}

# --- Frontend Flutter Web ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name phrx.skalway.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/phrx;
    index index.html;

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache estático
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# --- API PhRx ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-phrx.skalway.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location / {
        proxy_pass http://phrx_api_loopback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Health (útil para monitorização; Cloudflare pode omitir cache)
    location = /api/v1/health {
        proxy_pass http://phrx_api_loopback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }
}

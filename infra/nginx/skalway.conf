# Skalway reverse-proxy (produção)
# Domínios alvo — ajustar upstreams conforme deploy.

upstream website_upstream {
    server website:3000;
}

upstream phrx_api_upstream {
    server phrx_api:3300;
}

upstream gastro_api_upstream {
    server gastro_api:3300;
}

# skalway.com → website
server {
    listen 80;
    server_name skalway.com www.skalway.com;

    location / {
        proxy_pass http://website_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# phrx.skalway.com → PhRx Flutter / web host
server {
    listen 80;
    server_name phrx.skalway.com;

    root /var/www/phrx;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# api.phrx.skalway.com → PhRx API
server {
    listen 80;
    server_name api.phrx.skalway.com;

    location / {
        proxy_pass http://phrx_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }
}

# api.gastro.skalway.com → Gastro API
server {
    listen 80;
    server_name api.gastro.skalway.com;

    location / {
        proxy_pass http://gastro_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
